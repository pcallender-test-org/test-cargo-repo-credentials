version: 2
registries:
  artifactory:
    type: cargo-registry
    registry: artifactory
    url: "https://triala6oit3.jfrog.io/artifactory/api/cargo/cargorepo/index/"
    token: "Bearer ${{secrets.SECRET_JFROG_TOKEN}}"
    
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    registries: 
      - artifactory
    schedule:
      interval: "daily"
