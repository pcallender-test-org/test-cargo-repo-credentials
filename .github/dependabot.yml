version: 2
registries:
  dummy-registry:
    type: cargo-registry
    registry: artifactory
    url: https://triala6oit3.jfrog.io/artifactory/api/cargo/cargorepo/index/
    token: "Token ${{secrets.SECRET_JFROG_TOKEN}}"
    
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    registries: 
      - "dummy-registry"
    schedule:
      interval: "daily"
